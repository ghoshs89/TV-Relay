name: Build APK

on:
  push:
    branches: [ main ]
    # Changes to docs or tools alone don't build or publish a release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:

env:
  # SHA-256 of the release signing certificate (public, safe to commit).
  # Builds fail if the APK is signed with anything else.
  RELAY_CERT_SHA256: 165d1842e00291d7adc2dcab4f76604bc6372ac3cdf151ced8486ff00c2a6b82

permissions:
  contents: write   # publish each build as a GitHub Release for the in-app updater

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the committed Gradle wrapper; this action also verifies the wrapper's checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testReleaseUnitTest --stacktrace --no-daemon
          STATUS=$?
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob("app/build/test-results/testReleaseUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              n, bad = int(r.get("tests", 0)), int(r.get("failures", 0)) + int(r.get("errors", 0))
              t += n; f += bad
              print(f"{r.get('name')}: {n} tests, {bad} failed")
              for c in r.iter("testcase"):
                  for x in list(c.findall("failure")) + list(c.findall("error")):
                      print(f"::error::{c.get('classname')}.{c.get('name')}: {(x.get('message') or '')[:300]}")
          print(f"Total: {t} tests, {f} failed")
          PY
          exit $STATUS

      - name: Lint
        run: |
          ./gradlew :app:lintRelease --no-daemon
          python3 .github/lint-gate.py app/build/reports/lint/lint.xml

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-1.0.${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret RELAY_KEYSTORE_B64 is missing or empty."; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret RELAY_KEYSTORE_PASSWORD is missing or empty."; exit 1; fi
          KS="$RUNNER_TEMP/relay-release.jks"
          # Tolerate stray spaces or line breaks picked up while pasting.
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::RELAY_KEYSTORE_B64 is not valid base64. Re-copy the whole line from the secrets file."; exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias relay > /dev/null 2>&1; then
            echo "::error::The password doesn't open the keystore (or the keystore is incomplete). Re-check both secrets."; exit 1
          fi
          FP=$(keytool -exportcert -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias relay | sha256sum | cut -d' ' -f1)
          if [ "$FP" != "$RELAY_CERT_SHA256" ]; then
            echo "::error::Keystore opened, but it is not the expected key (got ${FP:0:16}…). Use the latest secrets file."; exit 1
          fi
          echo "RELAY_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "Signing secrets OK: keystore decodes, password opens it, fingerprint matches ${FP:0:16}…"

      - name: Check update token
        env:
          UPDATE_TOKEN: ${{ secrets.RELAY_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::warning::RELAY_UPDATE_TOKEN secret not set. This build can't update itself; in-app updates stay off."
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $UPDATE_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=1")
          if [ "$CODE" != "200" ]; then
            echo "::error::RELAY_UPDATE_TOKEN can't read releases of ${{ github.repository }} (HTTP $CODE). It needs Contents: Read-only on this repo and must not be expired."
            exit 1
          fi
          echo "Update token OK: it can read this repo's releases."

      - name: Build release APK
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_UPDATE_TOKEN: ${{ secrets.RELAY_UPDATE_TOKEN }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          OUT=$("$SIGNER" verify --print-certs "$APK")
          echo "$OUT" | grep -i "SHA-256"
          if ! echo "$OUT" | grep -qi "SHA-256 digest: $RELAY_CERT_SHA256"; then
            echo "::error::APK is not signed with the Relay release key."; exit 1
          fi
          echo "APK signature verified."

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Relay-1.0.${{ github.run_number }}.apk"

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke-test.sh out/Relay-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Relay-1.0.${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish release for in-app updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          APK="out/Relay-1.0.${{ github.run_number }}.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            # Re-run of the same build: replace the APK on the existing release.
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "Relay 1.0.${{ github.run_number }}" --notes-file notes.txt --latest
          fi
          echo "Published $TAG"
