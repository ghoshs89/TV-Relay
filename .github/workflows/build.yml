name: Build APK

on:
  push:
    branches: [ main ]
    # Changes to docs or tools alone do not build or publish a release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      bench:
        description: 'Also run the benchmark (about 12 more minutes)'
        type: boolean
        default: false
      screenshots:
        description: 'Capture the README gallery on Android TV and phone emulators'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as a GitHub pre-release (does not notify stable users)'
        type: boolean
        default: false


env:
  # SHA-256 of the release signing certificate (public, safe to commit).
  # Builds fail if the APK is signed with anything else.
  RELAY_CERT_SHA256: 165d1842e00291d7adc2dcab4f76604bc6372ac3cdf151ced8486ff00c2a6b82
  RELAY_TELEMETRY_URL: ${{ vars.RELAY_TELEMETRY_URL }}

# Each job gets only what it needs. Only "publish" can write to the repository, and it runs no code
# from the repository: it checks the APK that "build" made and attaches it to a release. The signing
# key exists only inside "build", and is deleted as soon as the APK is signed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Uses the committed Gradle wrapper; this action also verifies the wrapper's checksum.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testReleaseUnitTest --stacktrace --no-daemon
          STATUS=$?
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for p in glob.glob("app/build/test-results/testReleaseUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              n, bad = int(r.get("tests", 0)), int(r.get("failures", 0)) + int(r.get("errors", 0))
              t += n; f += bad
              print(f"{r.get('name')}: {n} tests, {bad} failed")
              for c in r.iter("testcase"):
                  for x in list(c.findall("failure")) + list(c.findall("error")):
                      print(f"::error::{c.get('classname')}.{c.get('name')}: {(x.get('message') or '')[:300]}")
          print(f"Total: {t} tests, {f} failed")
          PY
          exit $STATUS

      - name: Lint
        run: |
          ./gradlew :app:lintRelease --no-daemon
          python3 .github/lint-gate.py app/build/reports/lint/lint.xml

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-1.0.${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret RELAY_KEYSTORE_B64 is missing or empty."; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret RELAY_KEYSTORE_PASSWORD is missing or empty."; exit 1; fi
          KS="$RUNNER_TEMP/relay-release.jks"
          # Tolerate stray spaces or line breaks picked up while pasting.
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::RELAY_KEYSTORE_B64 is not valid base64. Re-copy the whole line from the secrets file."; exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias relay > /dev/null 2>&1; then
            echo "::error::The password doesn't open the keystore (or the keystore is incomplete). Re-check both secrets."; exit 1
          fi
          FP=$(keytool -exportcert -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias relay | sha256sum | cut -d' ' -f1)
          if [ "$FP" != "$RELAY_CERT_SHA256" ]; then
            echo "::error::Keystore opened, but it is not the expected key (got ${FP:0:16}…). Use the latest secrets file."; exit 1
          fi
          echo "RELAY_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "Signing secrets OK: keystore decodes, password opens it, fingerprint matches ${FP:0:16}…"

      - name: Build release APK
        # No update token goes into the app: the repository is public, so the updater reads its releases without one.
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Delete the signing key
        if: always()
        run: |
          if [ -n "${RELAY_KEYSTORE_PATH:-}" ]; then rm -f "$RELAY_KEYSTORE_PATH"; fi
          echo "Keystore removed from the runner."

      - name: Verify APK signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          OUT=$("$SIGNER" verify --print-certs "$APK")
          echo "$OUT" | grep -i "SHA-256"
          if ! echo "$OUT" | grep -qi "SHA-256 digest: $RELAY_CERT_SHA256"; then
            echo "::error::APK is not signed with the Relay release key."; exit 1
          fi
          echo "APK signature verified."

      - name: Check the release APK has no benchmark code
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -p "$APK" 'classes*.dex' | grep -aq 'dev/relay/tv/bench/'; then
            echo "::error::The release APK contains benchmark classes (dev/relay/tv/bench). They belong to the benchmark build only."; exit 1
          fi
          echo "No benchmark code in the release APK."

      - name: Rename APK and record its SHA-256
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Relay-1.0.${{ github.run_number }}.apk"
          SUM=$(sha256sum "out/Relay-1.0.${{ github.run_number }}.apk" | cut -d' ' -f1)
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $SUM"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Relay-1.0.${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

  # Installs the APK that "build" made on an emulator: playback, profiles, the guide, and an upgrade
  # over a signed earlier release. No signing secrets and no write access.
  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Relay-1.0.${{ github.run_number }}
          path: out

      - name: Check this is the APK that was built
        run: |
          SUM=$(sha256sum "out/Relay-1.0.${{ github.run_number }}.apk" | cut -d' ' -f1)
          if [ "$SUM" != "${{ needs.build.outputs.sha256 }}" ]; then echo "::error::APK changed between jobs."; exit 1; fi
          echo "APK SHA-256 matches the build: $SUM"

      # The device check also builds and runs the instrumented tests (debug build, no release key).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the test media generator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download the signed upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.126 --pattern 'Relay-1.0.126.apk' --dir upgrade-baseline

      - name: Check playback, profiles, guide and signed upgrade on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/reliability-test.sh out/Relay-1.0.${{ github.run_number }}.apk upgrade-baseline/Relay-1.0.126.apk

  screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: tv
            target: android-tv
            api: 34
            arch: x86
          - layout: phone
            target: default
            api: 30
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Prepare the emulator and demo media tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: Capture the README gallery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/documentation-screenshots.sh ${{ matrix.layout }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gallery-${{ matrix.layout }}
          path: gallery-${{ matrix.layout }}/*.jpg
          if-no-files-found: error

  # The only job that can write to the repository. Runs on main after both checks passed, takes the
  # APK "build" made, checks it is byte for byte that APK and signed with the Relay key, and publishes it.
  publish:
    needs: [build, device-check]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # publish the build as a GitHub Release for the in-app updater
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Relay-1.0.${{ github.run_number }}
          path: out

      - name: Check the APK before publishing
        run: |
          set -e
          APK="out/Relay-1.0.${{ github.run_number }}.apk"
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          if [ "$SUM" != "${{ needs.build.outputs.sha256 }}" ]; then echo "::error::APK changed between jobs."; exit 1; fi
          SIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          if ! "$SIGNER" verify --print-certs "$APK" | grep -qi "SHA-256 digest: $RELAY_CERT_SHA256"; then
            echo "::error::APK is not signed with the Relay release key."; exit 1
          fi
          echo "APK matches the build ($SUM) and is signed with the Relay key."

      - name: Publish release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          APK="out/Relay-1.0.${{ github.run_number }}.apk"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            TITLE="Relay 1.0.${{ github.run_number }}"
            FLAG="--latest"
          else
            TITLE="Relay 1.0.${{ github.run_number }} (Pre-release)"
            FLAG="--prerelease"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            # Re-run of the same build: replace the APK on the existing release.
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "$TITLE" --notes-file notes.txt "$FLAG"
          fi
          echo "Published $TAG ($FLAG)"

  # Drives a benchmark build of the app on an emulator against a made-up provider and prints frame
  # times, list build times and time to first picture in the log. For comparing builds with each
  # other; it never blocks or delays a release (it runs alongside the build job, and a failure here
  # leaves the run green). It costs about as many Actions minutes as the build, so it runs only when
  # started by hand: Actions → Build APK → Run workflow, with "Also run the benchmark" ticked.
  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build the benchmark APK
        run: ./gradlew :app:assembleBenchmark --stacktrace --no-daemon

      - name: Make a test video
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          mkdir -p bench-out
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 150 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 50 -b:v 1500k -c:a aac -b:a 96k -f mpegts bench-out/test.ts
          ls -l bench-out/test.ts

      - name: Free disk space for the emulator
        # The emulator needs about 7.4 GB for its data partition and the runner has just under that
        # left after the build. Remove large toolchains this job does not use.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo apt-get clean
          df -h / | tail -1

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the benchmark on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/bench/bench.sh app/build/outputs/apk/benchmark/app-benchmark.apk bench-out/test.ts bench-out

      - name: Keep the benchmark logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-1.0.${{ github.run_number }}
          path: |
            bench-out/logcat.txt
            bench-out/report.txt
            bench-out/provider.log
            bench-out/cold-saved.txt
            bench-out/cold-json.txt
          retention-days: 14
          if-no-files-found: ignore
