name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/relay-release.jks"
            echo "RELAY_KEYSTORE_PATH=$RUNNER_TEMP/relay-release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::RELAY_KEYSTORE_B64 secret not set. This APK uses a temporary debug key, so the next build won't install over it."
          fi

      - name: Build release APK
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Relay-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Relay-1.0.${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
